name: Auto Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os_name: linux-musl
            use_musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${{ github.ref_name }}"
          else
            CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2 || echo "1.0.0")
            VER="v${CARGO_VER}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT

      - name: Install musl tools (Linux Musl)
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact with Version
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            OUT_NAME="delta-bypass-${VER}-windows-amd64.exe"
            cp "target/${{ matrix.target }}/release/delta-bypass.exe" "${OUT_NAME}"
          else
            OUT_NAME="delta-bypass-${VER}-${{ matrix.os_name }}-amd64"
            cp "target/${{ matrix.target }}/release/delta-bypass" "${OUT_NAME}"
            chmod +x "${OUT_NAME}"
          fi
          echo "OUT_NAME=${OUT_NAME}" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: ${{ env.OUT_NAME }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release Binary on Tag Push
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Send AstrBot QQ Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Send Message & Upload Windows & Linux Artifacts to AstrBot
        shell: bash
        run: |
          BASE_URL="${{ secrets.ASTRBOT_URL }}"
          if [ -z "$BASE_URL" ]; then
            echo "secrets.ASTRBOT_URL 未配置，跳过消息推送。"
            exit 0
          fi

          STATUS="${{ needs.build.result }}"
          if [ "$STATUS" = "success" ]; then
            TEXT="[Delta Bypass for Rust] 代码更新与自动构建成功"
          else
            TEXT="[Delta Bypass for Rust] 代码更新与自动构建失败"
          fi
          
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "${{ github.event.head_commit.message }}")
          COMMITTER=$(git log -1 --pretty=format:"%an" 2>/dev/null || echo "${{ github.actor }}")
          
          CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2 || echo "1.0.0")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v${CARGO_VER}"
          fi
          
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-status -r HEAD 2>/dev/null | head -n 15)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="无文件变更"
          fi
          
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          ARTIFACT_INFO="[构建产物清单 (${VER})]
- Windows x64: delta-bypass-${VER}-windows-amd64.exe
- Linux x64: delta-bypass-${VER}-linux-amd64
- Linux Musl x64: delta-bypass-${VER}-linux-musl-amd64"
          
          MSG="${TEXT}
[仓库] ${REPO}
[版本] ${VER}
[分支/Tag] ${BRANCH}
[提交者] ${COMMITTER}
[Commit] ${SHORT_SHA}
[提交说明] ${COMMIT_MSG}

检测到代码发生更改，具体变更的文件列表如下：
${CHANGED_FILES}

${ARTIFACT_INFO}

[Actions构建与产物下载] ${RUN_URL}
[Commit详情] ${COMMIT_URL}"
          
          FILES_ENDPOINT=$(echo "$BASE_URL" | sed 's|/api/v1/im/messages|/api/v1/files|')
          
          MSG_PARTS=$(jq -n --arg txt "$MSG" '[{type: "text", text: $txt}]')
          
          rm -f /tmp/uploaded_fids.txt
          find artifacts -type f | sort | while read -r filepath; do
            if [ -f "$filepath" ]; then
              UPLOAD_RES=$(curl -s -X POST "$FILES_ENDPOINT" \
                -H "Authorization: Bearer ${{ secrets.ASTRBOT_TOKEN }}" \
                -F "file=@$filepath" || true)
              FID=$(echo "$UPLOAD_RES" | jq -r '.data.attachment_id // .attachment_id // empty' 2>/dev/null || true)
              if [ -n "$FID" ]; then
                echo "$FID" >> /tmp/uploaded_fids.txt
              fi
            fi
          done
          
          if [ -f /tmp/uploaded_fids.txt ]; then
            while read -r fid; do
              if [ -n "$fid" ]; then
                MSG_PARTS=$(echo "$MSG_PARTS" | jq --arg fid "$fid" '. + [{type: "file", attachment_id: $fid}]')
              fi
            done < /tmp/uploaded_fids.txt
          fi
          
          # 支持使用英文逗号分割多个推送目标（同时推送个人 QQ 和 QQ 群）
          IFS=',' read -ra TARGETS <<< "${{ secrets.QQ_TARGET_ID }}"
          for target_item in "${TARGETS[@]}"; do
            target=$(echo "$target_item" | xargs)
            if [ -n "$target" ]; then
              payload=$(jq -n \
                --argjson msg_parts "$MSG_PARTS" \
                --arg target "$target" \
                '{umo: $target, target_id: $target, message: $msg_parts}')
              
              curl -s -X POST "${{ secrets.ASTRBOT_URL }}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.ASTRBOT_TOKEN }}" \
                -d "$payload" || true
            fi
          done
