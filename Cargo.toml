[package]
name = "delta-bypass"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Delta key bypass — automatic captcha and checkpoint handling for Platoboost links"
authors = ["Hasl_Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/AbabaHnb/Delta-bypass"
keywords = ["captcha", "automation", "bypass"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "delta-bypass"
path = "src/main.rs"

[lib]
name = "delta_bypass"
path = "src/lib.rs"

[dependencies]
# 网络 / networking
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
    "cookies",
    "gzip",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8"
url = "2"
urlencoding = "2"

# 数据格式 / data formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

# 加密和摘要 / encryption and hashing
aes = "0.8"
sha2 = "0.10"
md-5 = "0.10"

# 图片 / images
gif = "0.13"

# 多核并行 / use several CPU cores at once
rayon = "1"

# 杂项 / misc
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
# 测试里做临时目录 / temporary folders for tests
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# 测试也开优化，否则图片处理慢到没法跑
# Tests are optimised too, otherwise image work is far too slow to run.
[profile.test]
opt-level = 2
